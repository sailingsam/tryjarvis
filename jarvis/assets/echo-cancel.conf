# Mantrin's echo-cancel host — run as `pipewire -c echo-cancel.conf`.
#
# Deliberately a separate process rather than a module in the user's main
# PipeWire config: a config-loaded module holds a capture stream on the
# microphone 24/7, which keeps the OS "mic in use" indicator lit forever and
# makes it meaningless. As a child process, the canceller exists exactly as
# long as Mantrin holds the mic — pause Mantrin and the indicator goes out,
# because nothing is capturing. The OS light stays an honest witness.
#
# Base skeleton follows /usr/share/pipewire/filter-chain.conf.

context.properties = {
    log.level = 0
}

context.spa-libs = {
    audio.convert.* = audioconvert/libspa-audioconvert
    support.*       = support/libspa-support
}

context.modules = [
    { name = libpipewire-module-rt
        args = {
            nice.level = -11
        }
        flags = [ ifexists nofail ]
    }
    { name = libpipewire-module-protocol-native }
    { name = libpipewire-module-client-node }
    { name = libpipewire-module-adapter }

    { name = libpipewire-module-echo-cancel
        args = {
            library.name = aec/libspa-aec-webrtc
            source.props = {
                node.name        = "mantrin.ec.source"
                node.description = "Mantrin echo-cancelled mic"
            }
            sink.props = {
                node.name        = "mantrin.ec.sink"
                node.description = "Mantrin voice (echo-cancelled)"
            }
        }
    }
]
