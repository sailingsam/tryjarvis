name: CLA Assistant

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      - name: CLA Assistant
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: '.github/signatures/cla.json'
          path-to-document: 'https://github.com/sailingsam/tryjarvis/blob/main/CLA.md'
          branch: 'main'
          allowlist: 'sailingsam,dependabot[bot]'
          custom-notsigned-comment: >
            Thanks for the PR! One-time step before we can merge: please read
            the [CLA](https://github.com/sailingsam/tryjarvis/blob/main/CLA.md)
            (short — you keep ownership of your code) and sign by replying
            with the sentence below.
