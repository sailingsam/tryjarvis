[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mantrin"
version = "0.1.0"
description = "A personal chief of staff you talk to."
requires-python = ">=3.10"

# Dependencies stay in requirements*.txt for now: the base set is small, the
# voice set is optional and heavy, and this file exists so the package and the
# `mantrin` command are properly installed — importable from any directory,
# not only from a shell that happens to be sitting in the repo.

[project.scripts]
mantrin = "jarvis.cli:main"

[tool.setuptools.packages.find]
include = ["jarvis*"]

[tool.setuptools.package-data]
jarvis = ["assets/tray/*.png"]
